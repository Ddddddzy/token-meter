<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token Meter</title>
<style>
:root{color-scheme:light dark;--fg:#20232d;--sec:#666c7c;--line:rgba(95,110,140,.15);--track:rgba(95,110,140,.1);--hover:rgba(100,130,200,.08);--pill:rgba(255,255,255,.88);--surface:rgba(246,248,253,.94);--accent:#487bdd;--ease:cubic-bezier(.22,1,.36,1);--duration:460ms}
@media(prefers-color-scheme:dark){:root{--fg:#f0f3fb;--sec:#a0aabd;--line:rgba(160,180,215,.15);--track:rgba(150,170,210,.12);--hover:rgba(140,165,230,.1);--pill:rgba(145,165,210,.19);--surface:rgba(23,28,40,.94);--accent:#8cb2ff}}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:12px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--fg);font-variant-numeric:tabular-nums}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:#e5e7ea}.glass-image{position:absolute;inset:-24px;background-position:center;background-size:100% 100%;filter:blur(16px) saturate(.72);opacity:0;transition:opacity .2s}.glass-image.ready{opacity:1}.glass-wash{position:absolute;inset:0;background:rgba(248,249,251,.52)}.glass-tint{position:absolute;inset:0;background:var(--surface)}
.panel{position:relative;height:100%;display:flex;flex-direction:column;background:transparent;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 1px 0 rgba(255,255,255,.6)}
@media(prefers-color-scheme:dark){.glass{background:#25282f}.glass-wash{background:rgba(22,25,31,.55)}.panel{box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),inset 0 1px 0 rgba(255,255,255,.2)}}
.header{flex:none;padding:14px 16px 10px;display:flex;gap:12px;align-items:center}.brand{font-size:13px;font-weight:650}.live{font-size:10px;color:var(--sec);margin-left:auto;display:flex;align-items:center;gap:5px}.live i{width:5px;height:5px;background:#36b58a;border-radius:50%}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(125,140,168,.55) transparent;scrollbar-gutter:stable;padding:0 12px 16px 16px;overscroll-behavior:contain;scroll-behavior:smooth}.content::-webkit-scrollbar{width:7px}.content::-webkit-scrollbar-thumb{background:rgba(125,140,168,.48);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.pill{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--track);padding:3px;gap:2px;border-radius:10px;isolation:isolate}.indicator{position:absolute;top:3px;bottom:3px;left:3px;background:var(--pill);border:1px solid var(--line);border-radius:7px;box-shadow:0 1px 3px #0000000b;z-index:-1;transition:transform var(--duration) var(--ease),width var(--duration) var(--ease)}.pill button{background:transparent;border:0;min-width:0;padding:6px 2px;font-size:11px;color:var(--sec);transition:color .2s}.pill button[aria-selected=true]{color:var(--fg);font-weight:650}
.summary{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;margin:18px 0 14px}.lab{font-size:11px;color:var(--sec)}.big{font-size:clamp(24px,7.7vw,32px);line-height:1.25;font-weight:650;letter-spacing:-.04em;margin:5px 0;overflow-wrap:anywhere}.money{font-size:clamp(21px,6vw,26px)}.fine{font-size:10px;color:var(--sec);overflow-wrap:anywhere;line-height:1.6}.unit{font-size:10px;color:var(--sec)}.right{text-align:right}
.chart{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}.charthead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;color:var(--sec);font-size:10px}.charthead b{font-size:11px;font-weight:550}.charthead span{text-align:right;overflow-wrap:anywhere}canvas{width:100%;height:72px;display:block}.axis{display:flex;justify-content:space-between;color:var(--sec);font-size:9px;margin-top:4px;gap:4px}.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:10px;color:var(--sec)}.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}.costnote{margin-top:8px;color:var(--sec);font-size:10px;overflow-wrap:anywhere}
.breakdown{margin-top:14px}.listframe{position:relative;margin-top:10px}.row{padding:9px 8px;border-radius:9px;min-width:0;transition:background .2s}.row:hover{background:var(--hover)}.rowhead{display:grid;grid-template-columns:8px minmax(0,1fr) 14px;gap:7px;align-items:start}.dot{width:7px;height:7px;border-radius:50%;margin-top:6px}.name{font-size:12px;overflow-wrap:anywhere;word-break:break-word;min-width:0;line-height:1.5}.chevron{font-size:15px;line-height:18px;color:var(--sec);transition:transform var(--duration) var(--ease)}.row[aria-expanded=true] .chevron{transform:rotate(90deg)}.row[role=button]{cursor:pointer}.sub{font-size:10px;color:var(--sec);margin:2px 0 0 15px;overflow-wrap:anywhere}.metrics{margin:5px 0 0 15px;display:flex;flex-wrap:wrap;gap:3px 9px;align-items:baseline}.tokens{font-weight:600;font-size:12px}.share{font-size:10px;color:var(--sec)}.cost{font-size:11px;color:var(--sec);margin-left:auto;overflow-wrap:anywhere;max-width:100%}.bar{height:3px;background:var(--track);border-radius:5px;margin:6px 0 1px 15px;overflow:hidden}.bar i{display:block;height:100%;width:var(--width);background:var(--color);border-radius:5px;transition:width var(--duration) var(--ease)}
.details{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows var(--duration) var(--ease),opacity .32s;pointer-events:none}.details.open{grid-template-rows:1fr;opacity:1;pointer-events:auto}.details-inner{overflow:hidden;min-height:0}.detailpad{padding:3px 0 8px 16px;border-left:1px solid var(--line);margin-left:11px}.detailpad .row{padding:6px 7px}.detailpad .name{font-size:11px}.codexstats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:10px;color:var(--sec);margin:4px 8px 10px;overflow-wrap:anywhere}.codexstats strong{display:block;color:var(--fg);font-size:12px;font-weight:550}.notes{margin-top:8px;font-size:10px;color:var(--sec);overflow-wrap:anywhere}.empty{text-align:center;color:var(--sec);padding:30px 10px;line-height:1.7}
.settings{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.settings[hidden]{display:none}.settings h2{font-size:12px;margin:0 0 10px;font-weight:600}.settinghead{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--sec)}input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 14px}.sources{font-size:10px;color:var(--sec);overflow-wrap:anywhere}.source{margin:8px 0}.source b{font-size:11px;font-weight:550;color:var(--fg)}
.footer{flex:none;display:flex;align-items:center;gap:5px;padding:8px 12px 10px 16px;border-top:1px solid var(--line);background:var(--surface)}.status{flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere;color:var(--sec);font-size:10px;line-height:1.4}.icon{flex:none;border:0;border-radius:7px;background:transparent;display:grid;place-items:center;width:29px;height:29px;color:var(--sec)}.icon:hover,.icon[aria-pressed=true]{background:var(--hover);color:var(--fg)}svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.busy svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.viewghost{position:absolute;inset:0;pointer-events:none;z-index:2}
@media(prefers-reduced-motion:reduce){:root{--duration:0ms}.content{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.pill button:disabled{cursor:not-allowed;color:var(--sec);opacity:.5;font-size:10px}.footer{background:rgba(255,255,255,.16)}@media(prefers-color-scheme:dark){.footer{background:rgba(0,0,0,.12)}}.settinghint{font-size:10px;color:var(--sec);margin:-8px 0 12px;line-height:1.6}
</style></head><body>
<div class="glass" aria-hidden="true"><div class="glass-image" id="glassImage"></div><div class="glass-wash"></div><div class="glass-tint" id="glassTint"></div></div>
<main class="panel" id="panel">
<header class="header"><svg viewBox="0 0 64 64" style="width:22px;height:22px;flex:none;stroke:none" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="17" fill="#353940"/><path d="M16 34a16 16 0 0 1 32 0M32 35l9-9M20 48h24" fill="none" stroke="#f3f4f6" stroke-width="4" stroke-linecap="round"/></svg><span class="brand">Token Meter</span><span class="live"><i></i><span id="liveLabel">本机用量</span></span></header>
<div class="content" id="scroll">
<div class="pill" id="rangeTabs" role="tablist" aria-label="时间范围"><i class="indicator"></i><button role="tab" data-value="day" aria-selected="true">今日</button><button role="tab" data-value="7d" aria-selected="false">7 天</button><button role="tab" data-value="30d" aria-selected="false">30 天</button><button role="tab" data-value="all" aria-selected="false">全部</button></div>
<section class="summary"><div><div class="lab" id="sumLabel">今日用量</div><div class="big" id="total">—</div><div class="fine" id="exact">正在扫描…</div><div class="unit">tokens · 含缓存</div></div><div class="right"><div class="lab">用量估价</div><div class="big money" id="cost">—</div><div class="fine" id="coverage"></div><div class="unit">美元 · 按 API 价格折算</div></div></section>
<section class="chart"><div class="charthead"><b id="chartTitle">今日 · 按小时</b><span id="chartValue"></span></div><canvas id="chart" aria-label="Token 用量趋势"></canvas><div class="axis" id="axis"></div><div class="legend" id="legend"></div><div class="costnote" id="moneyNote"></div></section>
<section class="breakdown"><div class="pill" id="dimensionTabs" role="tablist" aria-label="统计维度"><i class="indicator"></i><button role="tab" data-value="cli" aria-selected="true">按 Agent</button><button role="tab" data-value="model" aria-selected="false">按模型</button><button role="tab" data-value="machine" aria-selected="false" aria-disabled="true" disabled tabindex="-1" title="待开发：尚未实现多设备导入、同步与去重">按设备 · 待开发</button></div><div class="listframe"><div id="list"></div></div><div class="notes" id="notes"></div></section>
<section class="settings" id="settings" hidden><h2>小窗设置</h2><div class="settinghead"><label for="scale">窗口大小</label><output id="scaleValue">100%</output></div><input id="scale" type="range" min="0.8" max="1.4" step="0.05" value="1"><div class="settinghead"><label for="glass">玻璃不透明度</label><output id="glassValue">80%</output></div><input id="glass" type="range" min="0.15" max="0.9" step="0.05" value="0.8"><div class="settinghint">向左更通透，向右更沉稳。磨砂模糊始终保留，文字不会随背景变淡。</div><div class="sources" id="sources"></div></section>
</div><footer class="footer"><span class="status" id="status" role="status">正在读取本机记录…</span><button class="icon" id="refresh" aria-label="重新扫描" title="重新扫描"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3h-3"/></svg></button><button class="icon" id="config" aria-label="小窗设置" title="小窗设置" aria-pressed="false"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"/></svg></button><button class="icon" id="close" aria-label="收起小窗" title="向下收起"><svg viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></svg></button></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),motion=matchMedia('(prefers-reduced-motion: reduce)'),dark=matchMedia('(prefers-color-scheme: dark)');
const CLI={codex:['Codex','#5592ee'],claude:['Claude','#d89752'],cmdc:['Command Code','#d67cab'],devin:['Devin','#43ae83'],opencode:['opencode','#46aab0'],cursor:['Cursor','#a385e2']};
const nameOf=c=>CLI[c]?.[0]||c,colorOf=c=>CLI[c]?.[1]||'#8d9bb3';
const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString();
const full=n=>Math.round(n).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=o=>window.chrome?.webview?.postMessage(o);
let range='day',dimension='cli',expanded=null,data=null,request=0,controller=null,loading=false,chartFrame=0,numberFrame=0,hover=-1,chartProgress=1,previousChart=[],lastSignature='',scale=1,glass=.8,saveTimer;
function select(group,value){const buttons=[...group.querySelectorAll('button')],index=buttons.findIndex(b=>b.dataset.value===value);buttons.forEach((b,i)=>b.setAttribute('aria-selected',i===index));const b=buttons[index],pill=group.querySelector('.indicator');if(b){pill.style.width=b.offsetWidth+'px';pill.style.transform='translateX('+(b.offsetLeft-3)+'px)'}}
function initTabs(id,callback){const group=$(id);group.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled){select(group,b.dataset.value);callback(b.dataset.value)}});group.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const buttons=[...group.querySelectorAll('button:not(:disabled)')],current=buttons.indexOf(document.activeElement);const i=e.key==='Home'?0:e.key==='End'?buttons.length-1:(current+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[i].focus();buttons[i].click()})}
function bill(r){return r.noprice?'待定价':String(r.bill||'$0').replace('估算 $','≈$').replace('标价 $','$').replace('网关 $','$')}
function row(r,key,color,label,sub='',cli=null){const pct=Math.round(r.tokens/Math.max(data.tokens,1)*100);return '<div class="row" data-key="'+esc(key)+'"'+(cli?' data-cli="'+esc(cli)+'" role="button" tabindex="0" aria-expanded="'+(expanded===cli)+'" aria-controls="detail-'+esc(cli)+'"':'')+'><div class="rowhead"><i class="dot" style="background:'+color+'"></i><span class="name">'+esc(label)+'</span>'+(cli?'<span class="chevron">›</span>':'<span></span>')+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'<div class="metrics"><span class="tokens">'+fmt(r.tokens)+'</span><span class="share">'+pct+'%</span><span class="cost">'+esc(bill(r))+'</span></div><div class="bar"><i style="--width:'+Math.max(.5,pct)+'%;--color:'+color+'"></i></div></div>'}
function codexDetails(){const c=data.codex;if(!c)return '';return '<div class="codexstats">'+[['输入（含缓存）',c.input],['缓存命中',c.cached],['输出（含推理）',c.output],['其中推理',c.reasoning]].map(([label,n])=>'<div>'+label+'<strong>'+full(n)+'</strong></div>').join('')+'</div>'}
function listHTML(){if(!data)return '';const rows=dimension==='cli'?data.byCli:dimension==='model'?data.byModel:data.byMachine;if(!rows.length)return '<div class="empty">'+esc(data.rangeLabel)+'暂无用量<br>新记录写入后会自动更新</div>';return rows.map(r=>{const cli=dimension==='cli'?r.name:null,owner=cli||r.cli,color=colorOf(owner);let html=row(r,dimension+':'+r.name,color,cli?nameOf(cli):dimension==='machine'&&r.name===data.machine?'本机 · '+r.name:r.name,dimension==='model'?(r.cli||'').split('/').map(nameOf).join(' / '):'',cli);if(cli){html+='<div class="details '+(expanded===cli?'open':'')+'" id="detail-'+esc(cli)+'"><div class="details-inner"><div class="detailpad">'+(cli==='codex'?codexDetails():'')+(data.byCliModel?.[cli]||[]).map(m=>row(m,'detail:'+cli+':'+m.name,color,m.name)).join('')+'</div></div></div>'}return html}).join('')}
function renderList(animate){const list=$('list'),positions=new Map([...list.querySelectorAll('[data-key]')].map(el=>[el.dataset.key,el.getBoundingClientRect()]));const old=animate&&!motion.matches?list.cloneNode(true):null;list.innerHTML=listHTML();if(old){old.removeAttribute('id');old.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));old.className='viewghost';old.setAttribute('aria-hidden','true');list.parentElement.appendChild(old);old.animate([{opacity:.75,transform:'translateY(0)'},{opacity:0,transform:'translateY(-6px)'}],{duration:180,easing:'ease-out'}).finished.catch(()=>{}).finally(()=>old.remove());[...list.querySelectorAll('[data-key]')].forEach((el,i)=>{const before=positions.get(el.dataset.key),after=el.getBoundingClientRect();el.animate(before?[{transform:'translateY('+(before.top-after.top)+'px)',opacity:.65},{transform:'none',opacity:1}]:[{transform:'translateY(10px)',opacity:0},{transform:'none',opacity:1}],{duration:460,delay:before?0:Math.min(i*22,100),easing:'cubic-bezier(.22,1,.36,1)'})})}}
function toggleCLI(cli){expanded=expanded===cli?null:cli;$('list').querySelectorAll('[data-cli]').forEach(row=>{const open=row.dataset.cli===expanded;row.setAttribute('aria-expanded',open);$('detail-'+row.dataset.cli)?.classList.toggle('open',open)})}
$('list').addEventListener('click',e=>{const r=e.target.closest('[data-cli]');if(r)toggleCLI(r.dataset.cli)});$('list').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const r=e.target.closest('[data-cli]');if(r){e.preventDefault();toggleCLI(r.dataset.cli)}}});
function animateNumbers(old,next){cancelAnimationFrame(numberFrame);const start=performance.now(),duration=motion.matches?0:460;function frame(now){const p=duration?Math.min(1,(now-start)/duration):1,e=1-Math.pow(1-p,4),tk=(old?.tokens||0)+(next.tokens-(old?.tokens||0))*e,cost=(old?.cost||0)+(next.cost-(old?.cost||0))*e;$('total').textContent=fmt(tk);$('cost').textContent='$'+cost.toFixed(2);if(p<1)numberFrame=requestAnimationFrame(frame)}numberFrame=requestAnimationFrame(frame)}
const canvas=$('chart'),ctx=canvas.getContext('2d');
function chartDraw(progress=1){if(!data)return;const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,W=rect.width,H=72;if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);const stacks=data.stacks||[],n=stacks.length||1,slot=W/n,bw=Math.max(1,slot-Math.min(6,slot*.3));const old=new Map(previousChart.map(x=>[x.label,x.parts]));const bins=stacks.map(x=>{const parts={},keys=new Set([...Object.keys(x.parts),...Object.keys(old.get(x.label)||{})]);for(const k of keys){const a=old.get(x.label)?.[k]||0;parts[k]=a+((x.parts[k]||0)-a)*progress}return parts});const peak=Math.max(1,...bins.map(p=>Object.values(p).reduce((a,b)=>a+b,0))),track=getComputedStyle(document.documentElement).getPropertyValue('--track').trim();bins.forEach((parts,i)=>{let bottom=H;if(i===hover){ctx.fillStyle=track;ctx.fillRect(i*slot,0,slot,H)}const total=Object.values(parts).reduce((a,b)=>a+b,0);if(!total){ctx.fillStyle=track;ctx.fillRect(i*slot+(slot-bw)/2,H-3,bw,3);return}Object.keys(parts).sort().forEach(cli=>{const h=parts[cli]/peak*(H-4);ctx.fillStyle=colorOf(cli);ctx.globalAlpha=hover<0||hover===i?1:.45;ctx.fillRect(i*slot+(slot-bw)/2,bottom-h,bw,Math.max(.5,h));bottom-=h});ctx.globalAlpha=1})}
function animateChart(old){cancelAnimationFrame(chartFrame);previousChart=old?.stacks||[];const start=performance.now(),duration=motion.matches?0:460;function frame(now){const p=duration?Math.min(1,(now-start)/duration):1;chartProgress=1-Math.pow(1-p,4);chartDraw(chartProgress);if(p<1)chartFrame=requestAnimationFrame(frame)}chartFrame=requestAnimationFrame(frame)}
function chartHead(){if(!data)return;const bins=data.stacks||[],bin=bins[hover],keys=[...new Set(bins.flatMap(x=>Object.keys(x.parts)))];$('chartTitle').textContent=bin?bin.label:data.chartLabel;$('chartValue').textContent=bin?fmt(Object.values(bin.parts).reduce((a,b)=>a+b,0))+' tokens':bins.length?'合计 '+fmt(data.tokens):'';$('legend').innerHTML=keys.map(cli=>'<span><i style="background:'+colorOf(cli)+'"></i>'+esc(nameOf(cli))+(bin?' '+fmt(bin.parts[cli]||0):'')+'</span>').join('');$('axis').innerHTML=(bins.length<=4?bins:bins.filter((_,i)=>i===0||i===bins.length-1||i===Math.floor(bins.length/2))).map(x=>'<span>'+esc(x.label)+'</span>').join('')}
canvas.addEventListener('mousemove',e=>{if(!data)return;const r=canvas.getBoundingClientRect();hover=Math.min(data.stacks.length-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*data.stacks.length)));chartDraw(chartProgress);chartHead()});canvas.addEventListener('mouseleave',()=>{hover=-1;chartDraw(chartProgress);chartHead()});
function render(next,animate){const old=data;data=next;hover=-1;$('sumLabel').textContent=next.rangeLabel+'用量';$('exact').textContent=full(next.tokens);$('coverage').textContent=next.tokens?(next.pricedPct===100?'全部已计价':next.pricedPct+'% 已计价'):'暂无用量';$('moneyNote').textContent=next.moneyNote;$('moneyNote').title='用量估价不代表订阅实际扣款';const signature=JSON.stringify([dimension,range,expanded,next.byCli,next.byModel,next.byMachine,next.byCliModel,next.codex]);if(signature!==lastSignature){renderList(animate);lastSignature=signature}if(!old||old.tokens!==next.tokens||old.cost!==next.cost)animateNumbers(old,next);if(!old||JSON.stringify(old.stacks)!==JSON.stringify(next.stacks))animateChart(old);else chartDraw();chartHead();const notes=[];if(next.unpriced.length)notes.push(next.unpriced.length+' 个模型暂无公开价格，token 已计入；费用暂未计入。');if(next.estPct)notes.push('≈ 表示采用估算 token 或参考费率。');if(next.sources?.cursor?.pending)notes.push('Cursor 估算仍在后台扫描，完成后自动更新。');if(next.errs?.length)notes.push('扫描异常：'+next.errs.join('；'));$('notes').textContent=notes.join(' ');$('status').textContent='更新于 '+new Date(next.at).toLocaleTimeString('zh-CN',{hour12:false})+' · '+next.machine+' · 扫描 '+next.scanMs+'ms';$('liveLabel').textContent=next.codex?.lastAt&&Date.now()-next.codex.lastAt<90000?'Codex 正在更新':'本机用量';select($('rangeTabs'),range);select($('dimensionTabs'),dimension)}
async function load(refresh=false,animate=false){if(loading&&!refresh&&!animate)return;const id=++request;controller?.abort();controller=new AbortController();loading=true;if(refresh)$('refresh').classList.add('busy');try{const res=await fetch('/api?range='+range+(refresh?'&refresh=1':''),{signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);const next=await res.json();if(id===request)render(next,animate)}catch(e){if(e.name!=='AbortError'&&id===request)$('status').textContent='读取失败：'+e.message+' · 点击刷新重试'}finally{if(id===request){loading=false;$('refresh').classList.remove('busy')}}}
initTabs('rangeTabs',value=>{if(value===range)return;range=value;expanded=null;load(false,true)});initTabs('dimensionTabs',value=>{if(value===dimension)return;dimension=value;expanded=null;lastSignature='';if(data){renderList(true);$('scroll').scrollTo({top:Math.min($('scroll').scrollTop,100),behavior:motion.matches?'instant':'smooth'})}});
$('refresh').onclick=()=>load(true,true);$('close').onclick=()=>post({hide:true});document.addEventListener('keydown',e=>{if(e.key==='Escape')post({hide:true})});
$('config').onclick=async()=>{const open=$('settings').hidden;$('settings').hidden=!open;$('config').setAttribute('aria-pressed',open);if(open){await readSettings();$('settings').scrollIntoView({behavior:motion.matches?'instant':'smooth',block:'start'})}};
function applySettings(ui){scale=Math.max(.8,Math.min(1.4,Number(ui.scale)||1));glass=Math.max(.15,Math.min(.9,Number(ui.glass)||.8));$('scale').value=scale;$('glass').value=glass;$('scaleValue').textContent=Math.round(scale*100)+'%';$('glassValue').textContent=Math.round(glass*100)+'%';document.documentElement.style.zoom=String(scale);const rgb=dark.matches?'22,25,31':'248,249,251';document.documentElement.style.setProperty('--surface','rgba('+rgb+','+glass+')');requestAnimationFrame(()=>{select($('rangeTabs'),range);select($('dimensionTabs'),dimension);chartDraw()})}
async function readSettings(){try{const res=await fetch('/api/ui'),ui=await res.json();applySettings(ui);$('sources').innerHTML='<div>数据来源（只读；修改配置后重启）</div>'+(ui.configFile?'<div class="source">配置文件：'+esc(ui.configFile)+'</div>':'')+ui.paths.map(p=>'<div class="source"><b>'+esc(p.name)+(p.enabled===false?' · 已禁用':p.exists===false?' · 路径不存在':p.exists===true?' · 已发现':'')+'</b><div>'+esc(p.path||'—')+'</div></div>').join('')}catch(e){$('status').textContent='设置读取失败：'+e.message}}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{const res=await fetch('/api/ui',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scale,glass})});if(!res.ok)throw Error('HTTP '+res.status)}catch(e){$('status').textContent='设置保存失败：'+e.message}},200)}
$('scale').oninput=e=>{applySettings({scale:Number(e.target.value),glass});post({scale});queueSave()};$('glass').oninput=e=>{applySettings({scale,glass:Number(e.target.value)});queueSave()};
window.__paintBg=url=>{const image=new Image();image.onload=()=>{$('glassImage').style.backgroundImage='url('+JSON.stringify(url)+')';$('glassImage').classList.add('ready')};image.src=url};
window.__panelShown=()=>load();
motion.addEventListener('change',()=>post({reducedMotion:motion.matches}));
dark.addEventListener('change',()=>applySettings({scale,glass}));new ResizeObserver(()=>{select($('rangeTabs'),range);select($('dimensionTabs'),dimension);chartDraw(chartProgress)}).observe($('panel'));
const query=new URLSearchParams(location.search);applySettings({scale:Number(query.get('scale'))||1,glass:.8});readSettings().then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>post({ready:true,reducedMotion:motion.matches}))));load();setInterval(()=>{if(!document.hidden)load()},5000);
</script></body></html>
